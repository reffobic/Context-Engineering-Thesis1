# Phase 2 ablation queue (new freeze, branch phase2-next): GAPA ablation rerun and GASR ablation, qwen3.5:9b,
# SWE-Bench-Lite (27 tasks) + Loc-Bench (56 tasks), location instruction ON, stop sequence OFF (as Nov 3).
# Per arm and dataset: "full" (needed for the deltas), the four shared switches, and the arm's two gate rows
#   GAPA: gate_no_scores, gate_no_deps          GASR: gasr_gate_off (always expand), gasr_gate_no_shortcut
# 7 jobs x 2 arms x 2 datasets = 28 jobs, ordered by priority (see the job order note below). Optional heading controls are not queued.
# Needs: indexes for both datasets built under this SHA (preflight fails the job otherwise), a clean worktree and
# data/queue/record_authorisation.json for this SHA and the harness commit that is checked out.
# Launch:
#   PYTHONPATH=eval_harness/src python3 -m harness.queue \
#     --profile eval_harness/profiles/ubuntu-4080.toml \
#     --queue eval_harness/queues/phase2-ablations.toml \
#     --pipeline-config eval_harness/configs/pipeline_phase2.toml \
#     --configs eval_harness/configs --cwd .
# Estimates are minutes for the whole job; a job is started only if estimate x safety_factor fits before the hard stop.
# Do not run this while a LocAgent or other Ollama job holds the GPU (see docs/handover/phase2_next_runs.md).

[queue]
enabled = true
frozen_sha = "cacecedb1862539822e2009e0b17cb5406fee8b4"
hard_stop = "2026-12-01T08:00:00"
hard_stop_tz = "Africa/Cairo"
safety_factor = 1.25

[[job]]
id = "p2-abl-01-qwen3.5-9b-GAPA-swe-bench-lite"
model = "qwen3.5:9b"
arm = "GAPA"
dataset = "swe-bench-lite"
tasks = 27
estimated_minutes = 10
answer_locations_instruction = true

