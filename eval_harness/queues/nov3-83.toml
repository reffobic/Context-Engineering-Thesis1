# Nov 3 queue for ubuntu-4080: qwen3.5:9b, both datasets (27 + 56 = 83 tasks) for every arm, location instruction ON,
# stop sequence OFF (the prose is kept). Same pipeline SHA and the same index cache as the Oct 23 runs; a missing index
# fails the job's preflight (indexes are never built by a run), which stops the queue.
# Job ids start with "nov3-" so that they never match the Oct 23 pattern NN-<name> used by tests/regress_reports.py.
# After the second job (GAPA loc-bench) the queue holds (STOPPED marker): the GAPA jobs are compared with Oct 23 first.
# Run from a clean worktree by harness.queue.

[queue]
enabled = true
frozen_sha = "2350c0b2e064e4fd808e941731366e6cc71a9551"
hard_stop = "2026-10-29T08:00:00"
hard_stop_tz = "Africa/Cairo"
safety_factor = 1.25

[[job]]
id = "nov3-01-qwen3.5-9b-GAPA-swe-bench-lite"
model = "qwen3.5:9b"
arm = "GAPA"
dataset = "swe-bench-lite"
tasks = 27
estimated_minutes = 10
answer_locations_instruction = true

[[job]]
id = "nov3-02-qwen3.5-9b-GAPA-loc-bench"
model = "qwen3.5:9b"
arm = "GAPA"
dataset = "loc-bench"
tasks = 56
estimated_minutes = 19
answer_locations_instruction = true
hold_after = "compare the two GAPA jobs with Oct 23 (route, hops, gates, query_sha256, router tokens, final-context ids) before the other arms"

