# Harness-built arms and opt-in answer-call flags. NOT part of the Oct 23 config hashes: every value here defaults
# to "off", and the file's hash is recorded in a log line only when a new arm or a flag is actually used, so default
# requests and log headers stay as they were on 2350c0b / 9c8ff12.

[arms]
# arm name -> "HARNESS": composed by harness.arms from the pipeline's stage functions (arm_impl="harness")
ALWAYS_RAG = "HARNESS"      # retrieve -> flat prune -> RAG injection, no gate
ALWAYS_LC = "HARNESS"       # retrieve -> LC injection of the parent files, no gate
ALWAYS_LC_DEDUP = "HARNESS"
ALWAYS_LC_RANKED = "HARNESS"
PREASSESS = "HARNESS"       # retrieve -> flat prune -> GAPA call-1 metadata gate -> RAG if sufficient, else LC

[flags]
answer_locations_instruction = false
answer_stop = []            # stop sequences for the answer call only, e.g. ["END_LOCATIONS"]; [] = none

[text]
# Appended (after a blank line) to the task at answer-prompt build only when answer_locations_instruction is on.
# Phase 2: explicit format with a worked example. Models often wrote path::method without the class, which strict scoring marks wrong
# (handover Fix 5). The instruction text differs from the Nov 3 runs, so localization numbers are not comparable with Nov 3 on this axis.
answer_locations_instruction = "Begin your answer with a section titled LOCATIONS. List, one per line and most likely first, each place that should be edited to resolve this issue. Write a file as path, a module-level function as path::function, and a method as path::Class.method (always include the class name for a method). Example:\nLOCATIONS\nsrc/pkg/models.py::Order.total_price\nsrc/pkg/utils.py::parse_date\nsrc/pkg/settings.py\nEND_LOCATIONS\nAfter the line END_LOCATIONS, continue with a short explanation of the fix."
