# Which pipeline code is evaluated, and the environment it runs in. Hashed into every log line.

[pipeline]
# Frozen SHA for all arms: 3bbc52f (cd84fad merge + CHROMA_PATH env override) + patches/0002
# (GRAPHIFY_PATH_PREFIX env override and the Table VIII ablation switches, all default off).
frozen_sha = "2350c0b2e064e4fd808e941731366e6cc71a9551"
previous_frozen_sha = "3bbc52f220addbc648d4802dab6b1c658d427612"   # superseded; indexes re-keyed, runs on it revoked
earlier_frozen_shas = ["cd84fad1c13d8e7783bff39389cfb195e0cbac5b"]
chroma_path_patch = "patches/0001-retrieval-tool-chroma-path-env.patch"
ablation_patch = "patches/0002-graphify-prefix-env-and-ablation-switches.patch"
base_commit = "166dbd01e126cdfe91524534a172498746a49cc2"          # origin/main as frozen by the team
seed_alignment_commit = "50cf149efd6180b41098210b234efef81685ceaf"  # GAPA expands from GASR's seeds
# Results are recorded only for this pipeline SHA and for the harness commit named in the untracked file
# <data_dir>/queue/record_authorisation.json (written by the launcher at the user's confirmation). Both are
# part of the job identity and of every log line. Without a matching authorisation only --smoke runs are allowed.
record_results = true
record_results_pipeline_sha = "2350c0b2e064e4fd808e941731366e6cc71a9551"
mode_names = ["SELF_ROUTE", "GASR", "GAPA", "RAG", "LC"]
structure_rerank_expected = true     # retrieval_tool._STRUCTURE_RERANK (module flag, not an env var)
require_call_graph_json = true       # every index must ship call_graph.json; the job fails otherwise

# Harness commits whose bundles/builds must not be used for runs (predate the frozen merge).
# Pipeline commits runs must not use.
revoked_pipeline_shas = ["cd84fad1c13d8e7783bff39389cfb195e0cbac5b", "3bbc52f220addbc648d4802dab6b1c658d427612"]
revoked_harness_commits = [
  "2c22f5ddf2acf31675a112d96c3f73d548014901",
  "cd84fad1c13d8e7783bff39389cfb195e0cbac5b",   # configured frozen_sha cd84fad
  "ca03191ecd0bdaa8a74647b3b922383f3607f210",
  "b23415c1757d7f725c213d1257d42bf8b6c537f1",
  "bb5dbc1bad1449facac28a3aa42e89e0717900a3",
  "9516d84e59b848a950fc35329af9d970880c918e",
  "3bbc52f220addbc648d4802dab6b1c658d427612",   # holds the patched backend but a stale harness config
  "311f9069f33f3c0807ba18cc97cd734e85496525",
  "0d94581eab09c8a0b98991f2440b52e620e17915",   # configured frozen_sha 3bbc52f
  "065542e751d1b13a6b88770caf73dc13bdf984ba",
  "5053af59085b7abee5f0918531f4386191b4aebc",
  "f43b8efcfd5cdb6fcfa5bbb8f39381ae4680413e",
  "81bcfd2dc1a9a848f40759ab4f0c253cdae4bdab",
  "765d016d01809d6bcf4f59564f0a0d07093bdc07",
]

[env_pinned]
# Set in every pipeline process. "@model" is replaced by the run model tag (one LLM for all roles).
PYTHONHASHSEED = "0"
OLLAMA_NUM_CTX = "32768"             # must equal experiment.toml [ollama].num_ctx
MAX_CONTEXT_TOKENS = "24000"         # pipeline default, recorded explicitly
OLLAMA_MODEL = "@model"
ASSESSOR_MODEL = "@model"
EVAL_JUDGE_MODEL = "@model"
EMBEDDING_DEVICE = "cpu"             # query-time embedding on CPU on both machines
ANONYMIZED_TELEMETRY = "False"       # Chroma telemetry off; no effect on results
HF_HUB_OFFLINE = "1"                 # models are cached; no network access at load time
TRANSFORMERS_OFFLINE = "1"
GASR_HARD_CAP = "2"
GASR_MAX_NEIGHBORS = "8"
GASR_NEIGHBOR_BUDGET_FRACTION = "0.30"
OLLAMA_THINK = "0"
GRAPHIFY_PATH_PREFIX = ""            # indexes use repo-relative paths; the pipeline default "superset/" is for the Superset repo
# Table VIII ablation switches: all off here; a job turns on the ones of its setting (configs/ablations.toml).
ABL_NO_GRAPH_EXPAND = "0"
ABL_CONTAINS_ONLY = "0"
ABL_TRUNCATE_PRUNING = "0"
ABL_DENSE_ONLY = "0"
ABL_GATE_NO_SCORES = "0"
ABL_GATE_NO_DEPS = "0"
ABL_GATE_DROP_HEADINGS = "0"

[assert_unset]
# These change the pipeline when set. The launcher refuses to start if any is present in the environment.
vars = ["GAPA_COMPACT_PROMPT", "GAPA_NEED", "GAPA_GRAPHMETA", "GAPA_META", "INDEX_CONTEXT_OLLAMA",
        "GASR_OFFLINE", "RERANKER_ENABLED", "PREROUTE_DEBUG", "OLLAMA_SKIP"]

