name: Backend & Extension QA

on:
  push:
    branches:
      - main
      - "product/**"
      - "feat/**"
  pull_request:
    branches:
      - main

jobs:
  backend-tests:
    name: Tier 1 & Tier 2 Offline Backend Suite
    runs-on: ubuntu-latest
    env:
      HF_HUB_OFFLINE: "1"
      TRANSFORMERS_OFFLINE: "1"
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[test]"

      - name: Pre-cache MiniLM embedding model
        env:
          HF_HUB_OFFLINE: "0"
          TRANSFORMERS_OFFLINE: "0"
        run: |
          python -c "from sentence_transformers import SentenceTransformer; SentenceTransformer('all-MiniLM-L6-v2')"

      - name: Run offline pytest suite (Tier 1 & Tier 2)
        run: |
          pytest tests/backend backend/diamond/test_preroute_gate.py -v

  vscode-extension-typecheck:
    name: VS Code Extension TypeScript Check
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: vscode-extension
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: vscode-extension/package-lock.json

      - name: Install dependencies & typecheck
        run: |
          npm ci
          npx tsc -p ./ --noEmit
